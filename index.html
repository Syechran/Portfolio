<!doctype html>
<html lang="en" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syechran</title>

    <!-- Fonts: preconnect + non-blocking agar loader langsung tampil -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap"
      />
    </noscript>

    <!-- Loader styles (inline agar tampil sebelum bundle JS/CSS dieksekusi) -->
    <style>
      html.is-loading { overflow: hidden; }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #e8e3d3;
        transition: opacity 0.5s ease;
      }

      #app-loader.app-loader--hidden {
        opacity: 0;
        pointer-events: none;
      }

      .app-loader__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }

      .app-loader__ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 3px solid rgba(222, 101, 54, 0.25);
        border-top-color: #de6536;
        animation: app-loader-spin 0.8s linear infinite;
      }

      .app-loader__text {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #de6536;
      }

      @keyframes app-loader-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loader__ring { animation-duration: 2s; }
      }
    </style>

    <!--
      Loader normalnya ditutup oleh React (src/App.jsx) setelah font +
      semua gambar selesai di-decode. Skrip ini hanya jaring pengaman
      bila bundle JS gagal dimuat, agar loader tidak menggantung selamanya.
    -->
    <script>
      (function () {
        setTimeout(function () {
          var el = document.getElementById('app-loader');
          document.documentElement.classList.remove('is-loading');
          if (!el) return;
          el.classList.add('app-loader--hidden');
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 600);
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="app-loader" role="status" aria-label="Loading">
      <div class="app-loader__inner">
        <div class="app-loader__ring"></div>
        <p class="app-loader__text">Syechran</p>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
